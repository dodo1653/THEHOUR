<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#0c0b0a;overflow:hidden}canvas{display:block}</style>
</head><body><canvas id="c" width="1500" height="1500"></canvas>
<script>
// HOURPAD ticker image: a flat LED dot-matrix panel. HOUR lit orange, PAD lit cream, every other dot an unlit lens.
const S = 1500, N = 29, P = S / N
const F = {
  H: ['10001', '10001', '10001', '11111', '10001', '10001', '10001'],
  O: ['01110', '10001', '10001', '10001', '10001', '10001', '01110'],
  U: ['10001', '10001', '10001', '10001', '10001', '10001', '01110'],
  R: ['11110', '10001', '10001', '11110', '10010', '10001', '10001'],
  P: ['11110', '10001', '10001', '11110', '10000', '10000', '10000'],
  A: ['01110', '10001', '10001', '11111', '10001', '10001', '10001'],
  D: ['11110', '10001', '10001', '10001', '10001', '10001', '11110'],
}
const lit = new Map()   // "c,r" -> 'o' | 'w'
function word(txt, c0, r0, kind) {
  let c = c0
  for (const ch of txt) { F[ch].forEach((row, r) => [...row].forEach((b, k) => { if (b === '1') lit.set((c + k) + ',' + (r0 + r), kind) })); c += 6 }
}
word('HOUR', 3, 7, 'o'); word('PAD', 6, 15, 'w')

let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647
const cv = document.getElementById('c'), g = cv.getContext('2d')
const cx = c => (c + 0.5) * P, cy = r => (r + 0.5) * P, R = P * 0.41

// ground: warm black with a soft ember haze behind the lit word
g.fillStyle = '#0b0908'; g.fillRect(0, 0, S, S)
let hz = g.createRadialGradient(S / 2, S * 0.4, 0, S / 2, S * 0.45, S * 0.62)
hz.addColorStop(0, 'rgba(255,90,20,.13)'); hz.addColorStop(1, 'rgba(255,90,20,0)'); g.fillStyle = hz; g.fillRect(0, 0, S, S)

// unlit lenses
for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
  if (lit.has(c + ',' + r)) continue
  const x = cx(c), y = cy(r)
  const gr = g.createRadialGradient(x - R * .25, y - R * .3, R * .1, x, y, R)
  gr.addColorStop(0, '#2a211c'); gr.addColorStop(.7, '#17120f'); gr.addColorStop(1, '#0f0c0a')
  g.fillStyle = gr; g.beginPath(); g.arc(x, y, R, 0, 7); g.fill()
  g.strokeStyle = 'rgba(255,220,190,.05)'; g.lineWidth = 1.5; g.beginPath(); g.arc(x, y, R - 1, 3.6, 5.3); g.stroke()
}

// bloom: the lit dots drawn big and blurred underneath
const bl = document.createElement('canvas'); bl.width = bl.height = S; const b = bl.getContext('2d')
for (const [k, kind] of lit) { const [c, r] = k.split(',').map(Number); b.fillStyle = kind === 'o' ? '#ff5a10' : '#ffd9b0'; b.beginPath(); b.arc(cx(c), cy(r), R * 1.05, 0, 7); b.fill() }
g.save(); g.filter = 'blur(38px)'; g.globalAlpha = .55; g.globalCompositeOperation = 'lighter'; g.drawImage(bl, 0, 0); g.filter = 'blur(12px)'; g.globalAlpha = .45; g.drawImage(bl, 0, 0); g.restore()

// lit LEDs: hot core, saturated body, darker rim, a small lens highlight
for (const [k, kind] of lit) {
  const [c, r] = k.split(',').map(Number), x = cx(c), y = cy(r), j = 0.94 + rnd() * 0.08
  const gr = g.createRadialGradient(x, y, 0, x, y, R)
  if (kind === 'o') { gr.addColorStop(0, '#fff1de'); gr.addColorStop(.28, '#ffb071'); gr.addColorStop(.62, '#ff6a1a'); gr.addColorStop(.9, '#e2480a'); gr.addColorStop(1, '#a83104') }
  else { gr.addColorStop(0, '#ffffff'); gr.addColorStop(.35, '#fff6ea'); gr.addColorStop(.75, '#f1e3cf'); gr.addColorStop(1, '#bfa98d') }
  g.globalAlpha = j; g.fillStyle = gr; g.beginPath(); g.arc(x, y, R, 0, 7); g.fill(); g.globalAlpha = 1
  const hl = g.createRadialGradient(x - R * .32, y - R * .36, 0, x - R * .32, y - R * .36, R * .42)
  hl.addColorStop(0, 'rgba(255,255,255,.55)'); hl.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = hl; g.beginPath(); g.arc(x, y, R, 0, 7); g.fill()
}

// vignette + grain
const vg = g.createRadialGradient(S / 2, S / 2, S * .3, S / 2, S / 2, S * .75)
vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.55)'); g.fillStyle = vg; g.fillRect(0, 0, S, S)
const im = g.getImageData(0, 0, S, S), d = im.data
for (let i = 0; i < d.length; i += 4) { const n = (rnd() - .5) * 14; d[i] += n; d[i + 1] += n; d[i + 2] += n }
g.putImageData(im, 0, 0)
document.title = 'done'
</script></body></html>
